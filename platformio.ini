; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Shared settings inherited by both display variants
[common]
platform = espressif32
board = adafruit_feather_esp32_v2
framework = arduino
board_build.partitions = huge_app.csv
board_build.psram = true
build_flags =
	-DBOARD_HAS_PSRAM
	-DCORE_DEBUG_LEVEL=0
	-DCONFIG_FREERTOS_PLACE_FUNCTIONS_INTO_FLASH=1
	-DCONFIG_RINGBUF_PLACE_FUNCTIONS_INTO_FLASH=1
	-Wl,-Map=firmware.map
build_unflags =
	-mfix-esp32-psram-cache-issue
	-mfix-esp32-psram-cache-strategy=memw
monitor_speed = 115200
build_type = release
lib_deps =
	greiman/SdFat@^2.3.1
	lovyan03/LovyanGFX@^1.2.0
	adafruit/Adafruit DRV2605 Library@^1.2.2
	mathertel/RotaryEncoder@^1.6.0
	https://github.com/pschatzmann/ESP32-A2DP.git
	https://github.com/pschatzmann/arduino-audio-tools.git
	https://github.com/pschatzmann/arduino-libhelix.git
	bblanchon/ArduinoJson@^7.4.2
	siara-cc/Sqlite3Esp32@^2.5
	bodmer/TJpg_Decoder@^1.0.8

; 320-wide: 240x320 panel in landscape (default hardware — pio run)
[env:adafruit_feather_esp32_v2]
extends = common

; 240-wide: 240x240 square panel (pio run -e adafruit_feather_esp32_v2_240wide)
[env:adafruit_feather_esp32_v2_240wide]
extends = common
build_flags =
	${common.build_flags}
	-DDISPLAY_240WIDE
